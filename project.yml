name: OasesChat
options:
  bundleIdPrefix: dev.oases.chat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  developmentLanguage: zh-Hans
  # Drop navigator folder refs for local SPM packages after generate (see
  # packages comment + scripts/strip_local_package_folder_refs.py).
  postGenCommand: python3 scripts/strip_local_package_folder_refs.py

settings:
  base:
    SWIFT_VERSION: "5.10"
    # String Catalogs: let the Swift compiler extract keys (with real format
    # specifiers like %lld). Without this, Xcode's catalog sync falls back to
    # untyped extraction: it marks the real keys stale and adds `%@` copies
    # with no translations (happened 2026-09-30).
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    ENABLE_MODULE_VERIFIER: NO
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "9"
    DEVELOPMENT_TEAM: "2UYA2Z7QQP"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      VALIDATE_PRODUCT: YES

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

# OpenMinis-aligned SPM dependencies.
# All app SPM deps are vendored under vendor/spm/ so builds don't depend on a
# live GitHub fetch (network flakiness previously blocked resolve).
#
# XcodeGen always adds navigator folder refs for local packages (Packages
# group). Those folders cause Xcode to open nested `.swiftpm/xcode` and emit
# `Couldn't load project "xcode"`, which then cascades into
# `Missing package product`. After `xcodegen generate`, run
# `scripts/strip_local_package_folder_refs.py` to keep the SPM package
# references but drop the navigator folder refs. Do NOT use
# excludeFromProject: true — that drops XCLocalSwiftPackageReference too.
packages:
  SwiftAnthropic:
    path: vendor/spm/SwiftAnthropic
  swift-cmark:
    path: vendor/spm/swift-cmark
  SwiftMath:
    path: vendor/spm/SwiftMath
  # Prefer the real Silero+WebRTC binary package (vendored). If the binary
  # artifact is missing, temporarily point this path to RealTimeCutVADStub.
  RealTimeCutVADLibrary:
    path: vendor/spm/RealTimeCutVADLibrary
  # libraries.dev official SwiftUI ports (vendored, MIT).
  # BorderBeamKit / MetalFxKit compile .metal shaders — must build through
  # Xcode/xcodebuild (SwiftPM alone leaves default.metallib uncompiled).
  ThinkingOrbsKit:
    path: vendor/spm/ThinkingOrbsKit
  BorderBeamKit:
    path: vendor/spm/BorderBeamKit
  BotAvatarsKit:
    path: vendor/spm/BotAvatarsKit
  MetalFxKit:
    path: vendor/spm/MetalFxKit

targets:
  OasesChat:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OasesChat
        excludes:
          - "**/.DS_Store"
          - "**/*.env"
          # Alpine rootfs is shipped as a PRE-FAKEFSIFIED tree
          # (data/ + meta.db). The .tar.gz form had 335 absolute
          # symlinks installd refuses; fakefsify rewrites them as
          # SQLite rows so the bundled `data/` is regular files only.
          # Added below as a folder reference so Xcode treats the
          # whole tree as one resource (preserving its layout in
          # the bundle).
          - "Resources/AlpineFakefs/**"
          - "Resources/AlpineFakefs"
          # Built-in skills vendored from OpenMinis/MinisSkills (see
          # scripts/skills/build_builtin_skills.py). Shipped as one folder
          # reference below; the .py/.sh files inside must not be compiled.
          - "Resources/BuiltinSkills/**"
          - "Resources/BuiltinSkills"
          # Third-party license texts for Settings → 开源许可; one folder
          # reference below so the bundle keeps them under Licenses/.
          - "Resources/Licenses/**"
          - "Resources/Licenses"
          # OpenMinis ContentView + AIChatView are compiled and wired as
          # AppMode.project (engineering mode) root surface.
      # Secrets.swift is generated by the preBuild script below; reference it
      # as a single source file rather than the whole Generated/ folder
      # (adding the folder as a build resource triggers "no rule to process
      # file of type 'folder'" warnings).
      - path: OasesChat/Generated/Secrets.swift
        # Missing in a fresh checkout until the first build generates it.
        optional: true
      # iSH bridge sources — ISHShellExecutor.{h,m} + DebugServer.{h,c}
      # are vendored from ish-arm64-master/app and compiled directly
      # into our target. They depend on libish.a / libish_emu.a /
      # libfakefs.a (pre-built statically below).
      - path: vendor/iSH/runtime
      - path: vendor/iSH/offloads
      - path: vendor/iSH/diagnostics
      - path: vendor/iSH/support
      - path: vendor/iSH/shared
      # cppjieba is a header-only C++ library; headers only, nothing to compile.
      - path: vendor/cppjieba/include
        buildPhase: none
      - path: vendor/iSH/include
        buildPhase: none
      - path: OasesChat/Resources/AlpineFakefs
        type: folder
      - path: OasesChat/Resources/BuiltinSkills
        type: folder
      - path: OasesChat/Resources/Licenses
        type: folder
      - path: OasesChat/Resources/RootfsPatch.bundle
        type: folder
      - path: OasesChat/Resources/KaTeX
        type: folder
    dependencies:
      # iSH static libs ride on `LIBRARY_SEARCH_PATHS +
      # OTHER_LDFLAGS -lish -lish_emu -lfakefs` below so we can swap
      # the path per platform ($PLATFORM_NAME). xcodegen's
      # `framework:` syntax hard-codes a single path which broke
      # device builds (pointed at the sim slice).
      #
      # iSH C code links these system libs transitively.
      - sdk: libsqlite3.tbd
      - sdk: libiconv.tbd
      - sdk: libresolv.tbd
      - sdk: libbz2.tbd
      - sdk: CoreLocation.framework
      - sdk: NaturalLanguage.framework
      - sdk: Security.framework
      # NativeOffload batch 2 — system frameworks backing
      # apple-{calendar,reminders,notification,photos,maps,media,speech,vision}.
      - sdk: EventKit.framework
      - sdk: UserNotifications.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: MapKit.framework
      - sdk: MediaPlayer.framework
      - sdk: AVFoundation.framework
      - sdk: Speech.framework
      - sdk: Vision.framework
      # NativeOffload batch 3 — apple-{location,nfc,bluetooth,weather,alarm}.
      # CoreLocation is already linked above for the older native skill bridges.
      - sdk: CoreNFC.framework
      - sdk: CoreBluetooth.framework
      - sdk: WeatherKit.framework
      # AlarmKit ships with iOS 26; the deployment target is 17, so it must be
      # weak-linked or dyld aborts the launch on older systems.
      - sdk: AlarmKit.framework
        weak: true
      # P0-3 — host app registers the FileProvider domain so the extension
      # surfaces under "浏览 → 位置" in iOS Files.
      - sdk: FileProvider.framework
      - package: SwiftAnthropic
      # OpenMinis markdown / math / VAD stack
      - package: swift-cmark
        product: cmark-gfm
      - package: swift-cmark
        product: cmark-gfm-extensions
      - package: SwiftMath
        product: SwiftMath
      - package: RealTimeCutVADLibrary
        product: RealTimeCutVADLibrary
      # libraries.dev official SwiftUI ports
      - package: ThinkingOrbsKit
        product: ThinkingOrbsKit
      - package: BorderBeamKit
        product: BorderBeamKit
      - package: BotAvatarsKit
        product: BotAvatarsKit
      - package: MetalFxKit
        product: MetalFxKit
      # P0-3 — app extensions get embedded into the .app's PlugIns/.
      - target: OasesChatFileProvider
      - target: OasesChatShare
      - target: OasesChatWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.oases.chat.ios
        PRODUCT_NAME: Oases Chat
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: OasesChat/OasesChat.entitlements
        # NOTE: `INFOPLIST_KEY_*` settings only apply with
        # GENERATE_INFOPLIST_FILE, which this target does not use (it has
        # `info.path`). Info.plist keys belong in `info.properties` below.
        INFOPLIST_KEY_CFBundleDisplayName: "Oases Chat"
        # iSH bridge — Swift must see ISHShellExecutor through a
        # bridging header; vendor headers live in vendor/iSH/include.
        SWIFT_OBJC_BRIDGING_HEADER: OasesChat/OasesChat-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/vendor/iSH/include $(SRCROOT)/vendor/iSH/include/app $(SRCROOT)/vendor/iSH/runtime $(SRCROOT)/vendor/iSH/offloads $(SRCROOT)/vendor/iSH/support $(SRCROOT)/vendor/iSH/diagnostics $(SRCROOT)/vendor/iSH/shared $(SRCROOT)/vendor/cppjieba/include"
        # Per-platform iSH static library slices: iphonesimulator/
        # and iphoneos/ subdirs. `$(PLATFORM_NAME)` resolves to the
        # active SDK at build time so the linker picks up the right
        # arch slice. (Earlier flat layout linked the simulator
        # build into device builds and ld rejected it.)
        # Current vendored iSH simulator libs are arm64-only, so a
        # generic simulator build must not ask ld for an x86_64 slice.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/vendor/iSH/lib/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "-ObjC -lc++ -lish -lish_emu -lfakefs"
        # The vendored iSH libraries are built for an ARM64 Linux guest.
        # Keep the host-side runtime headers on the same struct layout.
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "GUEST_ARM64=1"
      configs:
        Release:
          # App Store / TestFlight validation rejects aps-environment =
          # development. Release signs with a production-APS copy; Debug
          # keeps the development entitlement above so dev push works.
          CODE_SIGN_ENTITLEMENTS: OasesChat/OasesChatRelease.entitlements
    preBuildScripts:
      - script: |
          set -e
          # Regenerate Secrets.swift from .env so the API key never lives in git.
          SRC="${SRCROOT}/OasesChat/.env"
          OUT_DIR="${SRCROOT}/OasesChat/Generated"
          OUT="${OUT_DIR}/Secrets.swift"
          mkdir -p "$OUT_DIR"
          API_KEY=""
          BASE_URL="https://api.oases.dev/v1"
          DIRECT_AI_KEY=""
          DIRECT_AI_BASE_URL=""
          PROJECT_AI_KEY=""
          PROJECT_AI_BASE_URL=""
          if [ -f "$SRC" ]; then
            while IFS='=' read -r key value || [ -n "$key" ]; do
              case "$key" in
                API_KEY) API_KEY="$value" ;;
                API_BASE_URL|OASES_API_BASE_URL) BASE_URL="$value" ;;
                DIRECT_AI_API_KEY|OASES_DIRECT_AI_API_KEY|OASES_PROVIDER_API_KEY) DIRECT_AI_KEY="$value" ;;
                DIRECT_AI_BASE_URL|OASES_DIRECT_AI_BASE_URL|OASES_PROVIDER_BASE_URL) DIRECT_AI_BASE_URL="$value" ;;
                PROJECT_AI_API_KEY|OASES_PROJECT_AI_API_KEY|OASES_PROJECT_API_KEY) PROJECT_AI_KEY="$value" ;;
                PROJECT_AI_BASE_URL|OASES_PROJECT_AI_BASE_URL|OASES_PROJECT_API_BASE_URL) PROJECT_AI_BASE_URL="$value" ;;
              esac
            done < "$SRC"
          fi
          swift_escape() {
            printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
          }
          swift_optional_string() {
            if [ -n "$1" ]; then
              printf '"%s"' "$(swift_escape "$1")"
            else
              printf 'nil'
            fi
          }
          swift_optional_url() {
            if [ -n "$1" ]; then
              printf 'URL(string: "%s")' "$(swift_escape "$1")"
            else
              printf 'nil'
            fi
          }
          # Shell expands $API_KEY / $BASE_URL to literals before Swift sees them.
          printf '%s\n' \
            '// AUTO-GENERATED from .env by project.yml preBuildScripts — do not edit.' \
            '// Keep .env out of git; this file is gitignored.' \
            'import Foundation' \
            'enum Secrets {' \
            "    static let apiKey: String? = $(swift_optional_string "$API_KEY")" \
            "    static let apiBaseURL: URL = URL(string: \"$(swift_escape "$BASE_URL")\")!" \
            "    static let directAIAPIKey: String? = $(swift_optional_string "$DIRECT_AI_KEY")" \
            "    static let directAIBaseURL: URL? = $(swift_optional_url "$DIRECT_AI_BASE_URL")" \
            "    static let projectAIAPIKey: String? = $(swift_optional_string "$PROJECT_AI_KEY")" \
            "    static let projectAIBaseURL: URL? = $(swift_optional_url "$PROJECT_AI_BASE_URL")" \
            '}' > "$OUT"
        name: Generate Secrets from .env
        inputFiles:
          - $(SRCROOT)/OasesChat/.env
        outputFiles:
          - $(SRCROOT)/OasesChat/Generated/Secrets.swift
      - script: |
          set -e
          bash "${SRCROOT}/scripts/configure_optional_frameworks.sh"
        name: Configure optional frameworks (FFmpeg)
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/configure_optional_frameworks.sh
          - $(SRCROOT)/vendor/frameworks
        outputFiles:
          - $(SRCROOT)/Configuration/OptionalFrameworks.generated.xcconfig
    info:
      path: OasesChat/Resources/Info.plist
      properties:
        # Languages the app doesn't support fall back to English, not to the
        # String Catalogs' source language (zh-Hans).
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: "Oases Chat"
        # `oases://` deep links (open_terminal / open / share / session / …),
        # routed by Services/Shared/DeepLinkRouter.swift. Without the scheme
        # registered here, iOS refuses to open the URL at all — LaunchServices
        # returns error 115 and DeepLinkRouter never runs.
        CFBundleURLTypes:
          - CFBundleURLName: dev.oases.chat.ios
            CFBundleURLSchemes:
              - oases
          # QingTeng account: QTC sends the GitHub / Microsoft sign-in back to
          # `qtc-oases://oauth` (on QTC's OAUTH_RETURN_URLS since 2026-10-30).
          # ASWebAuthenticationSession catches it without this entry; it is
          # listed so the scheme is declared like every other QingTeng app's.
          - CFBundleURLName: dev.oases.chat.ios.qtc
            CFBundleURLSchemes:
              - qtc-oases
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The languages of the in-app language picker. Every String Catalog
        # is fully translated into each of them; keep it that way with
        # `python3 scripts/i18n/check_coverage.py` (must print OK).
        CFBundleLocalizations:
          - zh-Hans
          - zh-Hant
          - en
          - ja
          - ko
          - fr
          - de
          - ru
        # Expose Documents/ to the Files app + iTunes file sharing so
        # users can actually open files the agent writes via
        # `file_write` (e.g. an HTML showoff page → tap to view in
        # Safari, share via AirDrop, drop into another app, etc.).
        # Without these the sandbox is opaque and the user can never
        # reach the output.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Live Activities (OpenMinis-aligned engineering progress)
        NSSupportsLiveActivities: true
        # Per-configuration value from Configuration/{Debug,Release}.xcconfig.
        OASESVerboseLogging: "$(INFOPLIST_KEY_OASESVerboseLogging)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        BGTaskSchedulerPermittedIdentifiers:
          - dev.oases.chat.ios.ogent.refresh
        # Capability-aligned background modes:
        # - fetch: Ogent automation via BGAppRefreshTask (there is no
        #   BGProcessingTask, so no `processing`)
        # - remote-notification: Push Notifications (aps-environment)
        # - audio: real playback only — reply read-aloud (TTS) and the
        #   `apple-player` offload. Silent-audio / location keep-alive is not
        #   shipped (App Review 2.5.4), so there is no `location` mode.
        UIBackgroundModes:
          - fetch
          - remote-notification
          - audio
        NFCReaderUsageDescription: "Agent 在你请求时读取或写入 NFC 标签内容"
        NSPhotoLibraryUsageDescription: "用于在对话里上传图片附件"
        NSPhotoLibraryAddUsageDescription: "用于将生成的图像和 QingTeng 账户卡保存到相册"
        NSCameraUsageDescription: "用于拍照后作为附件发送"
        NSMicrophoneUsageDescription: "用于语音输入、朗读和会议录音"
        NSSpeechRecognitionUsageDescription: "用于将语音和会议录音实时转换为文字"
        NSCalendarsUsageDescription: "Agent 读取日历事件以回答日程问题"
        NSCalendarsFullAccessUsageDescription: "Agent 读取日历事件以回答日程问题"
        NSRemindersUsageDescription: "Agent 创建提醒事项"
        NSRemindersFullAccessUsageDescription: "Agent 创建提醒事项"
        NSContactsUsageDescription: "Agent 按名字查找联系人"
        NSLocationWhenInUseUsageDescription: "Agent 获取当前位置以回答相关问题"
        NSAppleMusicUsageDescription: "Agent 读取本机音乐资料库以回答播放相关问题"
        NSBluetoothAlwaysUsageDescription: "Agent 扫描并连接蓝牙外设"
        NSFaceIDUsageDescription: "用于在你开启对话保护后，通过面容 ID 解锁 Oases Chat"
        NSLocalNetworkUsageDescription: "用于连接你在局域网中配置的 MCP 服务器、模型服务或网页"
        # Without UILaunchScreen iOS falls back to iPhone-4 compatibility mode
        # and renders the whole app at 320×480 scaled up to the real screen,
        # which clips TopBar/Composer edges. INFOPLIST_KEY_*_Generation only
        # works with auto-generated Info.plist, so declare these explicitly.
        UILaunchScreen:
          UIColorName: Background
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          # Must be nested under NSAppTransportSecurity — as a top-level
          # Info.plist key ATS ignores it.
          NSExceptionDomains:
            oaseschat.com:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: false
              NSExceptionRequiresForwardSecrecy: true
              NSExceptionMinimumTLSVersion: TLSv1.2
            oases.dev:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: false
              NSExceptionRequiresForwardSecrecy: true
              NSExceptionMinimumTLSVersion: TLSv1.2

  # ── App extensions (P0-3) ────────────────────────────────────────────
  # All three share the App Group with the host app. Sources live under
  # `Extensions/<Name>/`, ported from OpenMinis `FileProvider/`,
  # `ShareExtension/`, `AgentWidget/`. The few host-app types they need
  # (AppGroup / SharedContainerStore / PendingShare / AppLogger /
  # AgentActivityAttributes) are listed per-target rather than moved into a
  # framework — the file count is small and a shared framework would drag
  # the whole iSH link chain into each extension.

  OasesChatFileProvider:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Extensions/FileProvider
        excludes:
          - "Info.plist"
          - "FileProvider.entitlements"
      - path: OasesChat/Services/Shared/AppGroup.swift
      - path: OasesChat/Services/FileProvider/SharedFolderVisibility.swift
    dependencies:
      - sdk: FileProvider.framework
    entitlements:
      path: Extensions/FileProvider/FileProvider.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.oases.chat.ios
    settings:
      base:
        # NOTE: use INFOPLIST_FILE, not xcodegen's `info:` — the latter
        # GENERATES a plist and would drop the NSExtension dict.
        INFOPLIST_FILE: Extensions/FileProvider/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Oases Files"
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        PRODUCT_BUNDLE_IDENTIFIER: dev.oases.chat.ios.FileProvider
        PRODUCT_NAME: OasesChatFileProvider
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        # Match host app: vendored iSH/sim stacks are arm64-only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

  OasesChatShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Extensions/ShareExtension
        excludes:
          - "Info.plist"
          - "ShareExtension.entitlements"
      - path: OasesChat/Services/Shared/AppGroup.swift
      - path: OasesChat/Services/Shared/SharedContainerStore.swift
      - path: OasesChat/Services/Shared/PendingShare.swift
    entitlements:
      path: Extensions/ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.oases.chat.ios
    settings:
      base:
        INFOPLIST_FILE: Extensions/ShareExtension/Info.plist
        # installd REJECTS an appex whose Info.plist has no non-empty
        # CFBundleDisplayName — it fails at install, not at build.
        INFOPLIST_KEY_CFBundleDisplayName: "Share to Oases"
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        PRODUCT_BUNDLE_IDENTIFIER: dev.oases.chat.ios.Share
        # MainInterface.storyboard names the principal class with
        # `customModule="OasesChatShare"`, so the module name is load-bearing.
        PRODUCT_NAME: OasesChatShare
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

  OasesChatWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Extensions/AgentWidget
        excludes:
          - "Info.plist"
          - "AgentWidget.entitlements"
      # Shared with the host app's AgentLiveActivityManager — the widget
      # renders exactly the ContentState the manager pushes.
      - path: OasesChat/Services/Agent/Background/AgentActivityAttributes.swift
      # The Live Activity play/pause button's intent runs in the app process
      # but must compile inside the widget too.
      - path: OasesChat/Services/Shared/AudioTogglePlaybackIntent.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    entitlements:
      path: Extensions/AgentWidget/AgentWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.oases.chat.ios
    settings:
      base:
        INFOPLIST_FILE: Extensions/AgentWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Agent Activity"
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        PRODUCT_BUNDLE_IDENTIFIER: dev.oases.chat.ios.Widget
        PRODUCT_NAME: OasesChatWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

  OasesChatTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OasesChatTests
    dependencies:
      - target: OasesChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.oases.chat.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Oases Chat.app/Oases Chat"

  OasesChatUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OasesChatUITests
    dependencies:
      - target: OasesChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.oases.chat.ios.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OasesChat:
    build:
      targets:
        OasesChat: all
        OasesChatTests: [test]
        OasesChatUITests: [test]
    run:
      config: Debug
      askForAppToLaunch: false
      # iSH guest runtime uses SIGUSR1 for scheduling. Without this, LLDB
      # stops the process during bootstrap and Xcode sits on "Launching…".
      # Path must stay in the generated .xcscheme (re-check after xcodegen).
      customLLDBInitFile: $(SRCROOT)/Configuration/OasesChat.lldbinit
    test:
      config: Debug
      gatherCoverageData: true
      customLLDBInitFile: $(SRCROOT)/Configuration/OasesChat.lldbinit
      targets:
        - OasesChatTests
        - OasesChatUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
